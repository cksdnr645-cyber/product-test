<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>예술과 행운: 로또 추천</title>
  <link href="/style.css" rel="stylesheet">
</head>
<body>
  <div id="background-overlay"></div>
  <theme-toggle></theme-toggle>
  
  <div class="main-container">
    <h1>❤️ 민정이를 위한 행운의 로또 번호</h1>
    <div id="lotto-numbers"></div>
    <button id="generate-button">행운의 번호 생성</button>

    <!-- Comment Section -->
    <div class="comment-section">
      <h3>💬 응원의 한마디</h3>
      <div id="comment-list"></div>
      <div class="comment-input-group">
        <input type="text" id="comment-name" placeholder="이름" maxlength="10">
        <input type="text" id="comment-text" placeholder="댓글을 남겨주세요!" maxlength="100">
        <button id="submit-comment">등록</button>
      </div>
    </div>
  </div>

  <div id="painting-info"></div>

  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
